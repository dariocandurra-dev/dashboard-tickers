name: Actualizar y publicar el panel

on:
  schedule:
    # 22:30 UTC, lunes a viernes = 19:30 en Buenos Aires,
    # despues del cierre de NYSE y Nasdaq
    - cron: '30 22 * * 1-5'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'config/**'
      - 'templates/**'
      - 'src/**'
      - 'scripts/**'
      - '.github/workflows/actualizar.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: panel
  cancel-in-progress: false

env:
  TZ: America/Argentina/Buenos_Aires

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Instalar dependencias
        run: pip install -r requirements-ci.txt

      - name: Reconstruir el maestro de tickers
        # Toma los cambios hechos en config/tickers_extra.csv y clasificacion.csv
        run: python scripts/build_master.py

      - name: Reponer series faltantes
        # Solo baja lo que falta; con el panel completo no hace nada
        run: python scripts/repair_missing.py || true

      - name: Actualizar precios, indicadores, fundamentales y alertas
        run: python scripts/update_all.py --canal consola

      - name: Preparar el sitio
        run: |
          mkdir -p _site
          cp Dashboard_Tickers.html _site/index.html

      # El panel se publica ANTES de guardar los datos. Si el commit falla
      # porque alguien edito el repositorio mientras corria, el dashboard igual
      # queda actualizado: no se pierde la corrida entera por una carrera de git.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Guardar los datos actualizados
        run: |
          set -u
          git config user.name  "panel-bot"
          git config user.email "panel-bot@users.noreply.github.com"

          # Los datos generados se apartan y se reaplican sobre la ultima
          # version remota. No se hace merge: en data/ escribe solo este robot,
          # asi que lo recien calculado siempre gana. Reaplicar evita el
          # conflicto binario que daria un rebase sobre archivos .parquet.
          tmp=$(mktemp -d)
          cp config/tickers_master.csv "$tmp"/
          cp -r data "$tmp"/

          for intento in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp "$tmp"/tickers_master.csv config/
            cp -r "$tmp"/data/. data/
            git add config/tickers_master.csv data

            if git diff --staged --quiet; then
              echo "Sin cambios para guardar."
              exit 0
            fi

            git commit -m "Datos al $(date +%F)"
            if git push; then
              echo "Datos guardados en el intento $intento."
              exit 0
            fi
            echo "Push rechazado: el repositorio cambio mientras corria. Reintento $intento."
            sleep 5
          done

          echo "No se pudieron guardar los datos despues de 3 intentos."
          echo "El panel publicado SI quedo actualizado."
          exit 1
